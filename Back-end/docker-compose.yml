version: "3.9"

services:
  api:
    build: .
    container_name: printforge-api
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: printforge-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
  
  mongo:
    image: mongo:7
    container_name: printforge-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data: